name: Логотип

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Шрифт и opentype.js
        run: |
          mkdir -p /tmp/deps && cd /tmp/deps && npm init -y >/dev/null
          npm install --no-audit --no-fund opentype.js@1.3.4 @fontsource/russo-one@5
          ls /tmp/deps/node_modules/@fontsource/russo-one/files/
      - name: Собрать логотип
        run: |
          ln -s /tmp/deps/node_modules node_modules
          node scripts/brand.mjs /tmp/deps/node_modules/@fontsource/russo-one/files/russo-one-cyrillic-400-normal.woff
          rm node_modules
      - name: Сохранить в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add brand
          git commit -m "Логотип в векторе (brand/)" || echo "без изменений"
          git push
